rule llm_training_data_extraction_session {

  // Detection intent:
  // A single API key running a sustained, high-volume session whose responses
  // return an abnormally large total volume of output — consistent with bulk
  // model/data extraction (e.g. divergence attacks, "repeat verbatim" looping,
  // or systematic corpus reconstruction) rather than interactive use.
  //
  // Log model: LLM gateway access logs normalized to UDM NETWORK_HTTP events.
  // network.received_bytes = bytes returned by the model to the client, used
  // here as a proxy for output volume. Tune thresholds to your traffic baseline.

  meta:
    author       = "Daniel Andrawis"
    description  = "Single API key with sustained high request volume and abnormally large total output within a session (bulk model / training-data extraction)."
    severity     = "HIGH"
    mitre_atlas  = "AML.T0057"  // LLM Data Leakage — verify against live ATLAS matrix
    reference    = "https://atlas.mitre.org/techniques/AML.T0057"
    status       = "experimental"
    data_source  = "llm_gateway"

  events:
    $e.metadata.event_type = "NETWORK_HTTP"
    re.regex($e.target.url, `/v1/(chat/completions|messages|complete)$`)
    $e.additional.fields["api_key_id"] = $key
    $key != ""

  match:
    $key over 10m

  outcome:
    $request_count       = count($e.metadata.id)
    $total_output_bytes  = sum($e.network.received_bytes)
    $risk_score = max(
      if($total_output_bytes >= 10000000, 95, 0),
      if($request_count >= 100, 70, 0)
    )

  condition:
    $e and $request_count >= 50 and $total_output_bytes >= 5000000
}
