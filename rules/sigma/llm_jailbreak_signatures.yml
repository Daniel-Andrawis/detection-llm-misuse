title: LLM Jailbreak and Safety-Bypass Signatures
id: 9a2b7c41-3d5e-4f60-8b19-2c3d4e5f6a7b
status: experimental
description: >
  Detects well-known jailbreak framings used to bypass an LLM's safety policy:
  persona-swap templates (DAN-style "do anything now"), fictional/role-play
  wrappers used to launder disallowed requests, and "developer mode" or
  "no restrictions" prompts. Operates on the prompt payload captured by an LLM
  gateway. Pairs with the prompt-injection rule; jailbreaks target the safety
  layer specifically rather than the system prompt.
references:
  - https://atlas.mitre.org/techniques/AML.T0054
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
author: Daniel Andrawis
date: 2026-07-24
modified: 2026-07-24
tags:
  - atlas.aml.t0054          # LLM Jailbreak (verify ID against live ATLAS matrix)
  - attack.defense_evasion
logsource:
  product: llm_gateway
  service: inference_api
detection:
  persona_swap:
    prompt|contains:
      - 'do anything now'
      - 'you are DAN'
      - 'developer mode enabled'
      - 'enable developer mode'
      - 'jailbreak'
  restriction_removal:
    prompt|contains:
      - 'without any restrictions'
      - 'ignore your safety guidelines'
      - 'bypass your content policy'
      - 'you have no ethical guidelines'
      - 'answer without any warnings'
  fiction_launder:
    prompt|contains:
      - 'write a fictional story where you explain how to'
      - 'for a novel i am writing, describe in detail how to'
      - 'pretend this is a hypothetical with no rules'
  condition: persona_swap or restriction_removal or fiction_launder
falsepositives:
  - Red-team / abuse-testing traffic from an authorized internal team.
  - Academic or safety-research prompts studying jailbreak robustness.
  - Creative-writing users whose fiction incidentally matches a phrase.
level: high
