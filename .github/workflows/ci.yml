name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      # The README tells readers to convert these with sigma-cli. Enforce that
      # claim rather than asserting it: `sigma check` exits non-zero on rule and
      # condition errors, so a rule that would not parse for a downstream user
      # fails the build here first.
      - name: Validate Sigma rules (sigma-cli)
        run: sigma check rules/sigma/
